# ============================================================
# MOIL Intelligence — one-command production stack.
#   docker compose up -d     → app on :3000 (SQLite profile)
#   docker compose --profile pg up -d  → adds Postgres 16 (see DEPLOY_GUIDE.md §3)
# ============================================================
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-file:/app/db/custom.db}
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env}
      - NODE_ENV=production
    volumes:
      - app-db:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    profiles: ["pg"]
    environment:
      - POSTGRES_DB=moil
      - POSTGRES_USER=moil_app
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moil_app -d moil"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-db:
  pg-data:
